use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "mysearch-dev-secret-change-me"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

ui:
  static_use_hash: true
  default_theme: simple

engines:
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false

outgoing:
  request_timeout: 2.0
  max_request_timeout: 4.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
