version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: prismsearch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: prismsearch-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-prismsearch-dev-secret-change-me}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Enable after `mvn clean package` and `docker build -t prismsearch:latest .`
  prismsearch:
    image: prismsearch:latest
    container_name: prismsearch-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SEARXNG_BASE_URL=http://searxng:8080
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CX=${GOOGLE_CX}
      - BING_API_KEY=${BING_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
