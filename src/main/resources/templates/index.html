<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>PrismSearch · 多路召回聚合搜索</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<!-- ==================== 首页（未搜索时显示） ==================== -->
<div id="home-view" class="home-view">
    <div class="home-center">
        <div class="home-logo">
            <span class="c-blue">P</span><span class="c-red">r</span><span class="c-yellow">i</span><span class="c-blue">s</span><span class="c-green">m</span><span class="c-gray">Search</span>
        </div>
        <form id="home-search-form" class="home-search-box" autocomplete="off">
            <div class="search-input-container">
                <div class="search-input-wrap">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
                    </svg>
                    <input id="home-q" type="search" class="home-search-input"
                           placeholder="搜索你想要的内容..." maxlength="200" required autofocus/>
                    <button type="button" class="clear-btn hidden" title="清除">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <ul id="home-suggest" class="suggest-dropdown hidden"></ul>
            </div>
            <div class="home-actions">
                <button type="submit" class="google-btn">PrismSearch 搜索</button>
                <button type="button" class="toggle-advanced-btn" id="toggle-advanced-home">高级选项</button>
            </div>
            <div class="advanced-panel hidden" id="advanced-home">
                <div class="advanced-row">
                    <label><span>每页条数</span>
                        <select id="home-size" name="size">
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="50">50</option>
                        </select>
                    </label>
                    <label><span>搜索语言</span>
                        <select id="home-lang" name="lang">
                            <option value="zh-CN" selected>中文</option>
                            <option value="en-US">English</option>
                            <option value="ja-JP">日本語</option>
                            <option value="auto">自动检测</option>
                        </select>
                    </label>
                    <label><span>安全搜索</span>
                        <select id="home-safesearch" name="safesearch">
                            <option value="0">关闭</option>
                            <option value="1" selected>适中</option>
                            <option value="2">严格</option>
                        </select>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="home-nocache" name="nocache"/>
                        <span>绕过缓存</span>
                    </label>
                </div>
            </div>
        </form>
        <div class="home-providers" th:if="${enabledProviders != null and !enabledProviders.isEmpty()}">
            <span>聚合引擎：</span>
            <span class="provider-dot" th:each="p : ${enabledProviders}" th:title="${p}"></span>
            <span class="provider-names" th:text="${#strings.listJoin(enabledProviders, ' · ')}"></span>
        </div>
    </div>
    <footer class="home-footer">
        <span>PrismSearch · 并发多引擎召回 · RRF 融合排序</span>
        <span class="version" th:text="'v' + ${version}">v0.1.0</span>
    </footer>
</div>

<!-- ==================== 结果页（搜索后显示） ==================== -->
<div id="result-view" class="result-view hidden">
    <header class="result-header">
        <div class="result-header-left">
            <a href="#" class="result-logo" id="back-home">
                <span class="c-blue">P</span><span class="c-red">r</span><span class="c-yellow">i</span><span class="c-blue">s</span><span class="c-green">m</span><span class="c-gray">Search</span>
            </a>
        </div>
        <div class="result-header-center">
            <form id="result-search-form" class="result-search-box" autocomplete="off">
                <div class="search-input-container">
                    <div class="search-input-wrap">
                        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
                        </svg>
                        <input id="result-q" type="search" class="result-search-input" maxlength="200" required/>
                        <button type="button" class="clear-btn hidden" title="清除">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <ul id="result-suggest" class="suggest-dropdown hidden"></ul>
                </div>
            </form>
        </div>
        <div class="result-header-right">
            <button type="button" class="toggle-advanced-btn" id="toggle-advanced-result">选项</button>
        </div>
    </header>

    <!-- 结果页高级选项面板 -->
    <div class="result-advanced-panel hidden" id="advanced-result">
        <div class="advanced-row">
            <label><span>每页</span>
                <select id="result-size">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
            </label>
            <label><span>语言</span>
                <select id="result-lang">
                    <option value="zh-CN" selected>中文</option>
                    <option value="en-US">English</option>
                    <option value="ja-JP">日本語</option>
                    <option value="auto">自动</option>
                </select>
            </label>
            <label><span>安全</span>
                <select id="result-safesearch">
                    <option value="0">关闭</option>
                    <option value="1" selected>适中</option>
                    <option value="2">严格</option>
                </select>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="result-nocache"/>
                <span>绕过缓存</span>
            </label>
        </div>
    </div>

    <main class="result-container">
        <div id="summary" class="summary hidden"></div>
        <div id="status" class="status hidden"></div>
        <div id="results" class="results"></div>
        <nav id="pager" class="pager hidden"></nav>
    </main>

    <footer class="result-footer">
        <span>PrismSearch · 聚合搜索</span>
    </footer>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
